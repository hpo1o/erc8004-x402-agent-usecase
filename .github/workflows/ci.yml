name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: |
          npm install
          npm install --prefix colorizer-service
          npm install --prefix image-generator
          npm install --prefix erc8004
          npm install --prefix frontend

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: bun test tests/
