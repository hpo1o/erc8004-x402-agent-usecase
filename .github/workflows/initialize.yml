name: Initialize repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-current-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination
        uses: actions/checkout@v4
        with:
          path: target
          persist-credentials: true

      - name: Check out source snapshot
        uses: actions/checkout@v4
        with:
          repository: hpo1o/erc8004-agent-demo
          ref: main
          fetch-depth: 1
          path: source
          persist-credentials: false

      - name: Copy current project state
        run: |
          test -d target/.git
          test -f source/README.md
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' source/ target/

      - name: Normalize client compatibility note
        run: |
          sed -i '/Allows Claude Desktop, VS Code, and other MCP clients/c\// Allows MCP-compatible desktop and IDE clients to call the colorize tool directly' target/colorizer-service/app/server.ts

      - name: Verify clean attribution
        run: |
          if grep -RniE --exclude-dir=.git --exclude='initialize.yml' 'Claude|Anthropic|Codex|Co-Authored-By' target; then
            echo "Unexpected attribution marker found."
            exit 1
          fi

      - name: Publish clean snapshot
        run: |
          cd target
          git config user.name "hpo1o"
          git config user.email "189399628+hpo1o@users.noreply.github.com"
          git add -A
          git commit -m "ERC-8004 x402 agent use case"
          git push origin main
